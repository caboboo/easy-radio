<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a2b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Easy Radio">
  <title>Easy Radio 網路廣播機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="Easy Radio 網路廣播機">
    <header class="topbar">
      <button
        id="viewToggleButton"
        class="view-toggle-button"
        type="button"
        aria-label="顯示所有電台"
        aria-pressed="false"
        aria-controls="playerView stationListView"
      >
        <span id="viewToggleIcon" aria-hidden="true">▦</span>
        <span id="viewToggleText">所有電台</span>
      </button>

      <div class="clock">
        <div id="date">----/--/--</div>
        <div id="time">--:--</div>
      </div>
    </header>

    <section
      id="stationListView"
      class="station-list-view"
      aria-labelledby="stationListTitle"
      hidden
    >
      <h1 id="stationListTitle" tabindex="-1">選擇電台</h1>

      <div id="stationSearchSection" class="station-search" hidden>
        <label for="stationSearch">搜尋電台</label>
        <div class="station-search-controls">
          <input
            id="stationSearch"
            type="search"
            placeholder="搜尋電台名稱或頻率"
            aria-describedby="stationSearchStatus"
            autocomplete="off"
          >
          <button
            id="stationSearchClear"
            class="station-search-clear"
            type="button"
            aria-label="清除電台搜尋"
            hidden
          >
            清除
          </button>
        </div>
      </div>

      <p
        id="stationSearchStatus"
        class="station-search-status"
        aria-live="polite"
        hidden
      ></p>
      <div id="stationList" class="station-list" aria-label="電台列表"></div>
    </section>

    <section id="playerView" class="player-card">
      <div class="station-mark" aria-hidden="true">
        <strong id="stationBrandLead"></strong>
        <span id="stationBrandText"></span>
        <small id="stationFrequency"></small>
      </div>

      <div class="station-info">
        <h1 id="stationName"></h1>
        <p id="stationSubtitle" class="frequency"></p>

        <p id="song" class="song">目前曲目：電台未提供</p>

        <div class="visually-hidden" role="status" aria-live="polite">
          <span id="statusText">準備播放</span>
        </div>

        <div class="playback-controls">
          <button id="playButton" class="play-button" type="button" aria-pressed="false">
            <span id="playIcon" class="play-icon" aria-hidden="true">▶</span>
            <span id="playText">播放</span>
          </button>

          <div id="desktopVolume" class="desktop-volume" hidden>
            <label class="volume-control" for="volumeSlider">
              <span id="volumeText">音量 100%</span>
              <input
                id="volumeSlider"
                class="volume-slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="100"
              >
            </label>
            <button id="muteButton" class="mute-button" type="button" aria-pressed="false">
              靜音
            </button>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span id="versionText"></span>
      <span id="buildText"></span>
    </footer>

    <audio id="radio" preload="none" playsinline>
      <source id="radioSource" type="audio/mpeg">
    </audio>
  </main>

  <script src="version.js"></script>
  <script src="stations-data.js"></script>
  <script src="station-search.js"></script>
  <script src="script.js"></script>
  <script src="station-menu.js"></script>
</body>
</html>
