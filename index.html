<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a2b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Easy Radio">
  <title>Easy Radio 網路廣播機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="programOverlay" class="program-overlay" aria-hidden="true"></div>

  <aside
    id="programPanel"
    class="program-panel"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="programPanelTitle"
    inert
  >
    <div class="program-panel-header">
      <h2 id="programPanelTitle" tabindex="-1">
        已收錄節目（<span id="programCount">0</span>）
      </h2>
      <button
        id="programCloseButton"
        class="program-close-button"
        type="button"
        aria-label="關閉節目選單"
      >
        關閉
      </button>
    </div>

    <div class="program-search">
      <label for="programSearch">搜尋節目</label>
      <div class="program-search-controls">
        <input
          id="programSearch"
          type="search"
          placeholder="搜尋節目、主持人或電台"
          aria-describedby="programSearchStatus"
          autocomplete="off"
        >
        <button
          id="programSearchClear"
          class="program-search-clear"
          type="button"
          aria-label="清除節目搜尋"
          hidden
        >
          清除
        </button>
      </div>
    </div>

    <p
      id="programSearchStatus"
      class="program-search-status"
      aria-live="polite"
    >
      共 0 筆節目
    </p>
    <div id="programList" class="program-list" aria-label="節目列表"></div>
  </aside>

  <main class="app" aria-label="Easy Radio 網路廣播機">
    <header class="topbar">
      <button
        id="programMenuButton"
        class="program-menu-button"
        type="button"
        aria-label="開啟節目選單"
        aria-expanded="false"
        aria-controls="programPanel"
      >
        <span aria-hidden="true">☰</span>
        <span>節目</span>
      </button>

      <div id="volumeNote" class="volume-note" aria-label="音量請使用手機側邊按鍵">
        <span class="speaker" aria-hidden="true">🔊</span>
        <span>音量請用手機側邊按鍵</span>
      </div>

      <div class="clock">
        <div id="date">----/--/--</div>
        <div id="time">--:--</div>
      </div>
    </header>

    <section class="player-card">
      <div class="station-mark" aria-hidden="true">
        <strong>i</strong>
        <span>Radio</span>
        <small>FM96.3</small>
      </div>

      <div class="station-info">
        <h1>中廣音樂網</h1>
        <p class="frequency">i Radio FM96.3</p>

        <p id="song" class="song">目前曲目：電台未提供</p>

        <div id="status" class="status" role="status" aria-live="polite">
          <span class="status-dot"></span>
          <span id="statusText">準備播放</span>
        </div>

        <div class="playback-controls">
          <button id="playButton" class="play-button" type="button" aria-pressed="false">
            <span id="playIcon" class="play-icon" aria-hidden="true">▶</span>
            <span id="playText">播放</span>
          </button>

          <div id="desktopVolume" class="desktop-volume" hidden>
            <label class="volume-control" for="volumeSlider">
              <span id="volumeText">音量 100%</span>
              <input
                id="volumeSlider"
                class="volume-slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="100"
              >
            </label>
            <button id="muteButton" class="mute-button" type="button" aria-pressed="false">
              靜音
            </button>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>Easy Radio</span>
      <span>v0.3.2</span>
    </footer>

    <audio id="radio" preload="none" playsinline>
      <source src="https://stream.rcs.revma.com/ndk05tyy2tzuv" type="audio/mpeg">
    </audio>
  </main>

  <script src="script.js"></script>
  <script src="programs-data.js"></script>
  <script src="program-search.js"></script>
  <script src="program-menu.js"></script>
</body>
</html>
