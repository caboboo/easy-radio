<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a2b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Easy Radio">
  <title>Easy Radio 網路廣播機</title>
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="Easy Radio 網路廣播機">
    <button
      id="settingsButton"
      class="settings-button"
      type="button"
      aria-label="設定"
      aria-controls="settingsView"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.73v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.73l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
        ></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <header class="topbar">
      <button
        id="viewToggleButton"
        class="view-toggle-button"
        type="button"
        aria-label="顯示所有電台"
        aria-pressed="false"
        aria-controls="playerView stationListView"
      >
        <span id="viewToggleIcon" aria-hidden="true">▦</span>
        <span id="viewToggleText">所有電台</span>
      </button>

      <button
        id="settingsBackButton"
        class="settings-back-button"
        type="button"
        hidden
      >
        <span aria-hidden="true">←</span>
        <span>返回</span>
      </button>
    </header>

    <div class="main-content">
      <section
        id="settingsView"
        class="settings-view"
        aria-labelledby="settingsTitle"
        hidden
      >
        <h1 id="settingsTitle" tabindex="-1">設定</h1>
        <p class="settings-empty-state">目前尚無可調整的設定</p>

        <footer class="settings-version">
          <strong>Easy Radio</strong>
          <span id="versionText"></span>
          <span id="buildText"></span>
        </footer>
      </section>
    <section
      id="stationListView"
      class="station-list-view"
      aria-labelledby="stationListTitle"
      hidden
    >
      <h1 id="stationListTitle">選擇電台</h1>

      <div id="stationSearchSection" class="station-search" hidden>
        <label for="stationSearch">搜尋電台</label>
        <div class="station-search-controls">
          <input
            id="stationSearch"
            type="search"
            placeholder="搜尋電台名稱或頻率"
            aria-describedby="stationSearchStatus"
            autocomplete="off"
          >
          <button
            id="stationSearchClear"
            class="station-search-clear"
            type="button"
            aria-label="清除電台搜尋"
            hidden
          >
            清除
          </button>
        </div>
      </div>

      <p
        id="stationSearchStatus"
        class="station-search-status"
        aria-live="polite"
        hidden
      ></p>
      <div id="stationList" class="station-list" aria-label="電台列表"></div>
    </section>

    <section id="playerView" class="player-card">
      <div class="station-mark" aria-hidden="true">
        <strong id="stationBrandLead"></strong>
        <span id="stationBrandText"></span>
        <small id="stationFrequency"></small>
      </div>

      <div class="station-info">
        <h1 id="stationName"></h1>
        <p id="stationSubtitle" class="frequency"></p>

        <p id="song" class="song" hidden></p>

        <div class="visually-hidden" role="status" aria-live="polite">
          <span id="statusText">準備播放</span>
        </div>
      </div>
    </section>
    </div>


    <div class="playback-controls shared-playback-controls floating-playback-bar">
      <div class="playback-activity-bars" aria-hidden="true">
        <span class="playback-activity-bar"></span>
        <span class="playback-activity-bar"></span>
        <span class="playback-activity-bar"></span>
        <span class="playback-activity-bar"></span>
        <span class="playback-activity-bar"></span>
        <span class="playback-activity-bar"></span>
        <span class="playback-activity-bar"></span>
      </div>

      <button id="playButton" class="play-button" type="button" aria-pressed="false">
        <span id="playIcon" class="play-icon" aria-hidden="true">▶</span>
        <span id="playText">播放</span>
      </button>

      <div id="desktopVolume" class="desktop-volume" hidden>
        <label class="volume-control" for="volumeSlider">
          <span id="volumeText">音量 100%</span>
          <input
            id="volumeSlider"
            class="volume-slider"
            type="range"
            min="0"
            max="100"
            step="1"
            value="100"
          >
        </label>
        <button id="muteButton" class="mute-button" type="button" aria-pressed="false">
          靜音
        </button>
      </div>
    </div>

    <audio id="radio" preload="none" playsinline>
      <source id="radioSource" type="audio/mpeg">
    </audio>
  </main>

  <script src="version.js"></script>
  <script src="stations-data.js"></script>
  <script src="station-search.js"></script>
  <script src="script.js"></script>
  <script src="station-menu.js"></script>
</body>
</html>
